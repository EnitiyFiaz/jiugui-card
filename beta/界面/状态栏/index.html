'opening__fold-title'},cn={key:0,class:'opening__fold-body opening__fold-body--sub'},un=(0,o.defineComponent)({__name:'OpeningPanel',emits:['enter'],setup(e){const t=[{名:'小五版',标签:'当前模式',简介:'六杯酒、毒酒赌命——和梵·醺儿轮流对赌的完整玩法。下面是这一模式的全部规则。',节:[{题:'牌桌与流程',文:['桌上摆六只酒杯，其中若干杯是毒酒，其余是普通的酒。杯号固定，每一轮重新摆过、位置重排。','你先手开局，一轮结束后换她先手，如此交替。','你的回合：道具随时可用，用几件都行，也可以连喝几杯；本轮至少喝下一杯（啤酒也算）才允许结束回合；喝过之后可以劝她喝一杯，每轮一次，劝完仍然是你的回合。','她的回合：她先决定用不用道具、用几件，再喝自己的酒，也可能一口气连喝两杯，最后可能把一杯递到你唇边。','一轮结束：本轮的毒酒全部被喝光，或者桌上的酒被喝空，立刻换新一轮——重新摆六杯，双方各补一批道具。']},{题:'毒酒与醉意',文:['毒酒：喝下生命 -1。解酒药可以替你挡下一次毒伤。','普通的酒：喝下醉意 +1。','啤酒：喝下醉意 +2，是摆在桌上、公开又绝对安全的一杯。','生命归零，或者醉意超过自己的上限（默认 6，也就是到 7），立刻判负。','毒池：桌上那行"毒池 N~M 杯"不是确数，而是从台面上的公开动作推出来的可能范围——有人投毒、有人换酒，区间就会跟着移动。真实哪几杯有毒，只有喝到才知道。','揭晓：每一杯被谁喝掉，就在桌上公开那一杯的底细。喝过的杯子留在原处，毒酒会露红。']},{题:'道具总览',文:['道具每轮重新摆酒时各随机发一批，件数由档位决定；发到手的是什么，就得用什么。','解酒药：生命 +1，不能超过上限，满血时用不了。','透视酒杯：看穿一杯的底细。只有你知道结果，她看不见。','强行换杯：交换两杯的位置。这是公开动作，双方掌握的情报会跟着换位。','薄荷：醉意 -2。','毒药：把毒液悄悄混进桌上一杯里，连你自己也不知道落进了哪一杯，毒池只会往上浮。','道具在你自己的回合里随时可用，用几件都行，也不占喝酒的次数。']},{题:'劝酒',文:['你喝过一杯之后，可以点定一杯劝她喝下，每轮限一次，劝完仍是你的回合。她喝下若当场出事，对局就此见分晓。','她喝完自己的酒，也可能把一杯递到你唇边：你只能喝下，或者用强行换杯把它与别的杯子调换之后再喝——换到什么，就喝什么。','你劝过她的酒，她会记着，迟早讨回来。']},{题:'红冰与啤酒',文:['啤酒摆明在桌上：把任意一杯换成啤酒后，它公开摆放、绝对安全，谁喝都是醉意 +2。你可以自己留着喝，也可以劝她喝。','红冰是把一杯酒推向极端的东西：放进毒酒，喝下的人额外多扣一点生命；放进其他酒，喝下的人一点也不涨醉意。','所以加过冰的普通酒反而像一杯解药——但毒酒加了冰，就是奔着命去的。','两样都摆在明面上，谁想动，谁都看得见。']},{题:'胜负与赌注',文:['开局可挑档位：轻简（生命 2 · 每轮 1 件道具 · 毒酒 2）、普通（生命 3 · 每轮 2 件道具 · 毒酒 2）、狂欢（生命 5 · 每轮 3 件道具 · 毒酒 3）、深度（生命、每轮道具数、每轮毒酒数全部随机）。','判负只有两条路：生命归零，或者醉意超过自己的上限。谁先撑不住，谁就输。','你赢下一局：奖励次数 +1，可以对她提一个不破坏规则的要求。','她赢下一局：灵魂占有度 +20%。','占有度积满 100%：你的灵魂被彻底吞没——终局。']}]},{名:'经典恶魔轮盘',标签:'已上线',简介:'几杯毒几杯普通当面摆明——胆量与算计的极简赌局。下面是这一模式的全部规则。',节:[{题:'牌桌与流程',文:['每一轮她当面摆酒，明着告诉你：本轮几杯毒酒、几杯普通的酒。毒藏在哪只杯子里，只有天知道。','酒杯按顺序排开，桌上只有"当前的酒杯"能动——自饮是喝它，转嫁也是喝它，喝掉或倒掉后轮到下一杯。','你的回合：道具随时可用，用几件都行；然后选一杯——喝下当前的酒杯，或者把当前的酒杯递到她唇边。','你自饮喝到普通的酒：安然无恙，行动权还是你的，可以继续喝、继续用道具。','你自饮喝到毒酒：扣 1 点生命，换她行动。你逼她喝：无论喝出什么都换手。','桌上酒杯耗尽：她重新摆酒、重新报数，双方各补 2 件道具，行动权不变——装填不换手。','双方各 3 条命，开局你先手。没有劝酒，没有结束回合，也没有醉意。']},{题:'九件道具',文:['每轮重摆时双方各随机补 2 件，手上一共最多 8 件；道具栏双方公开。','验酒灯：照出当前这杯是毒是普通。只有你知道，她看不见。','解酒药：生命 +1，不能超过上限，满血时用不了。','手铐：拍在桌上，她的下一次行动权将被跳过；她动过之前不能连着铐。','倒酒：把当前的酒杯倒掉不喝，直接看下一杯——倒掉的这杯是什么，没人说。','烈性勾兑：给当前这杯兑入烈酒（桌上公开），这杯若是毒酒，喝下扣 2 点生命；是普通酒则无事发生。','小纸条：不知从哪递来一张纸条，告诉你桌上某一杯的底细。只有你知道。','抢酒：从她手里抢走一件道具，当场用掉。她空手时用不了。','劣质私酿：五五开的赌命酒——一半机会生命 +2，一半机会生命 -1。','调包：把当前这杯的毒/普通调换过来。是毒变普通还是普通变毒，用过才知道。']},{题:'胜负与赌注',文:['判负只有一条路：生命归零。没有醉意，没有别的花样。','你赢下一局：奖励次数 +1，可以对她提一个不破坏规则的要求。','她赢下一局：灵魂占有度 +20%。','占有度积满 100%：你的灵魂被彻底吞没——终局。']}]}],n=(0,o.ref)(new Set([0]));const a=(0,o.ref)(new Set(['0:0']));return(e,r)=>((0,o.openBlock)(),(0,o.createElementBlock)('div',Wt,[r[7]||(r[7]=(0,o.createStaticVNode)('<div class="opening__head"><svg class="opening__crest" viewBox="0 0 60 84" aria-hidden="true"><defs><linearGradient id="crestLiquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dd3f77"></stop><stop offset="1" stop-color="#ffc6e0"></stop></linearGradient></defs><path class="opening__crest-liquid" d="M9 11 A21 5.2 0 0 0 51 11 C50.4 34 47.2 55 43.6 68 C42.6 72.4 40.6 74.6 37 74.6 H23 C19.4 74.6 17.4 72.4 16.4 68 C12.8 55 9.6 34 9 11 Z"></path><path class="opening__crest-body" d="M9 11 C9.6 34 12.8 55 16.4 68 C17.4 72.4 19.4 74.6 23 74.6 H37 C40.6 74.6 42.6 72.4 43.6 68 C47.2 55 50.4 34 51 11"></path><ellipse class="opening__crest-rim" cx="30" cy="11" rx="21" ry="5.2"></ellipse></svg><div class="opening__titles"><div class="opening__title">万魔殿 · 对酒赌局</div><div class="opening__sub">在坐上牌桌之前，先听清规矩</div></div></div><div class="opening__divider" aria-hidden="true"><span></span><svg viewBox="0 0 12 12"><path d="M6 1 L11 6 L6 11 L1 6 Z"></path></svg><span></span></div>',2)),(0,o.createElementVNode)('div',Kt,[r[2]||(r[2]=(0,o.createElementVNode)('div',{class:'opening__section-title'},'开始',-1)),(0,o.createElementVNode)('div',Qt,[(0,o.createElementVNode)('button',{class:'opening__enter',type:'button',onClick:r[0]||(r[0]=t=>e.$emit('enter'))},[...r[1]||(r[1]=[(0,o.createStaticVNode)('<svg viewBox="0 0 60 84" aria-hidden="true"><defs><linearGra
