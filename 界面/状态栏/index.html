1。','啤酒：喝下醉意 +2，是摆在桌上、公开又绝对安全的一杯。','生命归零，或者醉意超过自己的上限（默认 6，也就是到 7），立刻判负。','毒池：桌上那行"毒池 N~M 杯"不是确数，而是从台面上的公开动作推出来的可能范围——有人投毒、有人换酒，区间就会跟着移动。真实哪几杯有毒，只有喝到才知道。','揭晓：每一杯被谁喝掉，就在桌上公开那一杯的底细。喝过的杯子留在原处，毒酒会露红。']},{题:'道具总览',文:['道具每轮重新摆酒时各随机发一批，件数由档位决定；发到手的是什么，就得用什么。','解酒药：生命 +1，不能超过上限，满血时用不了。','透视酒杯：看穿一杯的底细。只有你知道结果，她看不见。','强行换杯：交换两杯的位置。这是公开动作，双方掌握的情报会跟着换位。','薄荷：醉意 -2。','毒药：把毒液悄悄混进桌上一杯里，连你自己也不知道落进了哪一杯，毒池只会往上浮。','道具在你自己的回合里随时可用，用几件都行，也不占喝酒的次数。']},{题:'劝酒',文:['你喝过一杯之后，可以点定一杯劝她喝下，每轮限一次，劝完仍是你的回合。她喝下若当场出事，对局就此见分晓。','她喝完自己的酒，也可能把一杯递到你唇边：你只能喝下，或者用强行换杯把它与别的杯子调换之后再喝——换到什么，就喝什么。','你劝过她的酒，她会记着，迟早讨回来。']},{题:'红冰与啤酒',文:['啤酒摆明在桌上：把任意一杯换成啤酒后，它公开摆放、绝对安全，谁喝都是醉意 +2。你可以自己留着喝，也可以劝她喝。','红冰是把一杯酒推向极端的东西：放进毒酒，喝下的人额外多扣一点生命；放进其他酒，喝下的人一点也不涨醉意。','所以加过冰的普通酒反而像一杯解药——但毒酒加了冰，就是奔着命去的。','两样都摆在明面上，谁想动，谁都看得见。']},{题:'胜负与赌注',文:['开局可挑档位：轻简（生命 2 · 每轮 1 件道具 · 毒酒 2）、普通（生命 3 · 每轮 2 件道具 · 毒酒 2）、狂欢（生命 5 · 每轮 3 件道具 · 毒酒 3）、深度（生命、每轮道具数、每轮毒酒数全部随机）。','判负只有两条路：生命归零，或者醉意超过自己的上限。谁先撑不住，谁就输。','你赢下一局：奖励次数 +1，可以对她提一个不破坏规则的要求。','她赢下一局：灵魂占有度 +20%。','占有度积满 100%：你的灵魂被彻底吞没——终局。']}]}],n=(0,g.ref)(new Set([0])),t=(0,g.ref)(new Set(['0:0']));return(e,o)=>((0,g.openBlock)(),(0,g.createElementBlock)('div',cA,[o[7]||(o[7]=(0,g.createStaticVNode)('<div class="opening__head"><svg class="opening__crest" viewBox="0 0 60 84" aria-hidden="true"><defs><linearGradient id="crestLiquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dd3f77"></stop><stop offset="1" stop-color="#ffc6e0"></stop></linearGradient></defs><path class="opening__crest-liquid" d="M9 11 A21 5.2 0 0 0 51 11 C50.4 34 47.2 55 43.6 68 C42.6 72.4 40.6 74.6 37 74.6 H23 C19.4 74.6 17.4 72.4 16.4 68 C12.8 55 9.6 34 9 11 Z"></path><path class="opening__crest-body" d="M9 11 C9.6 34 12.8 55 16.4 68 C17.4 72.4 19.4 74.6 23 74.6 H37 C40.6 74.6 42.6 72.4 43.6 68 C47.2 55 50.4 34 51 11"></path><ellipse class="opening__crest-rim" cx="30" cy="11" rx="21" ry="5.2"></ellipse></svg><div class="opening__titles"><div class="opening__title">万魔殿 · 对酒赌局</div><div class="opening__sub">在坐上牌桌之前，先听清规矩</d
